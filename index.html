const SKINS=[{id:'night',n:'Клинок Ночи',r:1,img:'hero.webp?v=5',d:'Начальный облик'},{id:'rosara',n:'Розара',r:3,img:'witch.webp?v=2',d:'⚔️❤️ +10% · <i class="ico coin"></i> +25%',lock:'Победи Розару на 10 этапе'},{id:'priest',n:'Жрица Падшего Света',r:3,img:'priest.webp?v=3',d:'⚔️❤️ +7% · <i class="ico coin"></i> +15%',st:15,lock:'Дойди до 15 этапа'},{id:'fox',n:'Кицунэ Тёмной Луны',r:4,img:'fox.webp?v=3',d:'⚔️❤️ +10% · <i class="ico coin"></i> +60%',gem:1500,lock:'1500 кристаллов'},{id:'vamp',n:'Графиня Крови',r:3,img:'vamp.webp?v=1',d:'⚔️❤️ +8% · <i class="ico coin"></i> +20%',st:20,lock:'Дойди до 20 этапа'},{id:'frost',n:'Ледяная Королева',r:3,img:'frost.webp?v=1',d:'⚔️❤️ +9% · <i class="ico coin"></i> +20%',st:25,lock:'Дойди до 25 этапа'},{id:'silva',n:'Сильва Лесная',r:3,img:'silva.webp?v=1',d:'⚔️❤️ +9% · <i class="ico coin"></i> +25%',gem:600,lock:'600 кристаллов'},{id:'veil',n:'Вуаль Теней',r:3,img:'veil.webp?v=1',d:'⚔️❤️ +8% · <i class="ico coin"></i> +30%',gem:800,lock:'800 кристаллов'},{id:'selene',n:'Селена Лунная',r:4,img:'selene.webp?v=1',d:'⚔️❤️ +10% · <i class="ico coin"></i> +35%',st:30,lock:'Дойди до 30 этапа'},{id:'ignis',n:'Игнис, Дочь Дракона',r:4,img:'ignis.webp?v=1',d:'⚔️❤️ +11% · <i class="ico coin"></i> +40%',gem:1200,lock:'1200 кристаллов'},{id:'seraph',n:'Серафина Рассветная',r:4,img:'seraph.webp?v=1',d:'⚔️❤️ +12% · <i class="ico coin"></i> +50%',gem:2000,lock:'2000 кристаллов'},{id:'nova',n:'Нова-0',r:4,img:'nova.webp?v=1',d:'⚔️❤️ +14% · <i class="ico coin"></i> +60%',gem:2500,lock:'2500 кристаллов'}];
function chk(){SKINS.forEach(k=>{if(k.st&&S.st>=k.st)S.own[k.id]=1})}
function applySkin(){const k=SKINS.find(x=>x.id===S.skin)||SKINS[0];$('hsp').querySelector('img').src=k.img;$('av').style.backgroundImage='url('+k.img+')';$('av').style.backgroundPosition='45% 4%'}
act['Скины']=b=>{const k=SKINS.find(x=>x.id===b.dataset.a);chk();if(!S.own[k.id]){if(k.gem&&S.gems>=k.gem){S.gems-=k.gem;S.own[k.id]=1}else return k.gem?'Не хватает кристаллов ('+k.gem+')':k.lock}S.skin=k.id;applySkin();save();return 'Надето: '+k.n};
const skins=()=>panel('Скины',m=>(chk(),m?'<div class="row rw" style="font-size:28px;text-align:center">'+m+'</div>':'')+SKINS.map(k=>'<div class="row fr"><img class="sth" alt="" src="'+k.img+'"><span style="flex:1;color:'+RC[k.r]+'">'+k.n+'<br><small style="font-size:22px;color:#fff">'+k.d+'</small></span>'+(S.skin===k.id?'<b style="color:#7fe36a">Надето</b>':S.own[k.id]?'<button class="btn" data-a="'+k.id+'">Надеть</button>':'<button class="btn o" data-a="'+k.id+'">'+(k.gem?'<i class="ico gem"></i>'+k.gem:'🔒')+'</button>')+'</div>').join('')+'<div class="row rw" style="font-size:26px;opacity:.7;text-align:center">Новые скины скоро</div>');
$('nvk').onclick=skins;applySkin();
const SN2=['Силовик','Ловкач','Страж','Золотоискатель'],SC=['#ff6b6b','#6bff9c','#6bb6ff','#ffd24a'];
const SD=[['+10% атаки','+20% атаки','+35% атаки, +15% крита'],['+8% уклона','+15% уклона, +10% крита','+25% уклона, +20% крита'],['+15% здоровья','+30% здоровья','+55% здоровья'],['+20% золота','+50% золота, −10% урона','+100% золота, −20% урона']];
const mk=(s,r)=>({s,r,t:r>=2?Math.floor(Math.random()*4):-1});
const need=l=>Math.floor(30*Math.pow(1.105,l-1));
function gainXp(b){S.xp+=Math.floor(b*Math.pow(1.095,S.st-1)*(1+.25*S.reb));let up=0;while(S.lv<100&&S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;up++}if(S.lv>=100)S.xp=Math.min(S.xp,need(100));if(up)toast(S.lv>=100?'100 уровень! Доступно перерождение':'Уровень '+S.lv+'!')}
function sumSets(){const c=[0,0,0,0];S.eset.forEach(t=>{if(t>=0)c[t]++});return '<div style="font-size:23px;margin-top:6px">'+c.map((n,i)=>'<span style="color:'+SC[i]+'">'+SN2[i]+' '+n+'/6'+(n>=2?' ('+SD[i][n>=6?2:n>=4?1:0]+')':'')+'</span>').join('<br>')+'</div>'}
function bestAll(){for(let s=0;s<6;s++){let bi=-1;S.bag.forEach((b,i)=>{if(b.s===s&&b.r>S.rar[s]&&(bi<0||b.r>S.bag[bi].r))bi=i});if(bi>=0){const n=S.bag[bi];S.bag.splice(bi,1);S.bag.push({s,r:S.rar[s],t:S.eset[s]});S.rar[s]=n.r;S.eset[s]=n.t==null?-1:n.t}}bl()}
function sellJunk(){let g=0;S.bag=S.bag.filter(b=>{if(b.r<=0){g+=sell(0);return false}return true});S.gold+=g;bl();return fmt(g)}
function wearSet(t){for(let s=0;s<6;s++){let bi=-1;S.bag.forEach((b,i)=>{if(b.s===s&&b.t===t&&(bi<0||b.r>S.bag[bi].r))bi=i});if(bi<0)continue;const n=S.bag[bi];if(S.eset[s]===t&&S.rar[s]>=n.r)continue;S.bag.splice(bi,1);S.bag.push({s,r:S.rar[s],t:S.eset[s]});S.rar[s]=n.r;S.eset[s]=t}bl()}
function rebirth(){if(S.lv<100){popup('Перерождение','<div class="row rw" style="font-size:30px;text-align:center">Нужен 100 уровень (сейчас '+S.lv+').<br>За каждое перерождение: +10% к атаке и здоровью, +25% к золоту и опыту навсегда. Враги становятся сильнее: здоровье ×3, урон ×2.</div>','Понятно');return}
 popup('Перерождение №'+(S.reb+1),'<div class="row rw" style="font-size:30px;text-align:center">Сбросятся: уровень, этап, золото, улучшения слотов и обычные вещи.<br>Останутся: кристаллы, скины, клан и легендарные вещи.<br>Награда: +10% атаки и здоровья, +25% золота и опыта навсегда.</div>','Переродиться',()=>{S.reb++;S.st=1;S.gold=0;S.gear=[1,1,1,0,0,0];S.lv=1;S.xp=0;for(let i=0;i<6;i++)if(S.rar[i]<4){S.rar[i]=1;S.eset[i]=-1}S.bag=S.bag.filter(b=>b.r>=4);wave=1;hp=MAXHP();spawn();ui();bl();save();setTimeout(()=>beat('r'+S.reb,STORY['r'+S.reb]),500)},'Отмена')}
$('rbt').onclick=()=>{$('mdl').hidden=true;rebirth()};
let acc=0;spawn();if(!S.name)intro();setInterval(()=>{tick();if(++acc%5===0){$('gold').textContent=fmt(S.gold);document.querySelectorAll('.slot').forEach(b=>b.disabled=S.gold<cost(+b.dataset.i))}},100);
</script></body></html>
